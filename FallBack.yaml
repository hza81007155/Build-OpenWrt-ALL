port: 7890

# ============================= 1. DNS 优化配置 =============================
dns:
  enable: true
  ipv6: false
  cache-algorithm: arc
  enhanced-mode: fake-ip
  listen: :23453
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter-mode: rule
  respect-rules: false
  prefer-h3: false
  fake-ip-filter:
    - RULE-SET,private,real-ip
    - RULE-SET,apple@cn,real-ip
    - RULE-SET,cn,real-ip
    - RULE-SET,microsoft@cn,real-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query
  nameserver:
    - https://223.5.5.5/dns-query
    - https://119.29.29.29/dns-query

# ============================= 2. 锚点与正则定义 =============================
provider_config: &provider_config
  type: http
  interval: 86400
  proxy: DIRECT
  health-check:
    enable: true
    url: "http://www.apple.com/library/test/success.html"
    interval: 300
    lazy: true

# 正则匹配锚点（自动排除广告/公告节点）
FilterHK: &FilterHK '^(?=.*((?i)🇭🇰|香港|港|(\b(HK|Hong|HKG)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterTW: &FilterTW '^(?=.*((?i)🇨🇳|台湾|台|(\b(TW|Taiwan|ROC)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterSG: &FilterSG '^(?=.*((?i)🇸🇬|新加坡|坡|狮城|(\b(SG|Singapore|SIN)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterJP: &FilterJP '^(?=.*((?i)🇯🇵|日本|日|川日|东京|大阪|埼玉|(\b(JP|Japan|NRT|HND)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterKR: &FilterKR '^(?=.*((?i)🇰🇷|韩国|韩|首尔|春川|(\b(KR|Korea|SEL)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterUS: &FilterUS '^(?=.*((?i)🇺🇸|美国|美|波特兰|达拉斯|俄勒冈|凤凰城|费利蒙|硅谷|拉斯|洛杉矶|圣何塞|西雅图|芝加哥|(\b(US|USA|United States)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterUK: &FilterUK '^(?=.*((?i)🇬🇧|英国|英|伦敦|(\b(UK|United Kingdom|London)\b)))(?!.*(官网|到期|流量|客服|通知|说明)).*$'
FilterOther: &FilterOther "^(?!.*(DIRECT|🇺🇸|美|US|🇭🇰|香港|HK|🇯🇵|日本|JP|🇨🇳|台湾|TW|🇸🇬|新加坡|SG|🇰🇷|韩国|KR|🇬🇧|英国|UK|官网|到期|流量|客服)).*$"

