# ============================= 6. 路由规则 =============================
rules:
  # 1. 阻止国外 QUIC (UDP 443)，解决 YouTube/网页加载缓慢卡顿问题
  - AND,((NETWORK,UDP),(DST-PORT,443),(NOT,((RULE-SET,cn)))),REJECT

  # 2. 内网与私有网络直连
  - RULE-SET,private_ip,DIRECT,no-resolve
  - RULE-SET,private,DIRECT

  # 3. 广告拦截
  - RULE-SET,category-ads-all,REJECT
  - RULE-SET,ad_ip,REJECT,no-resolve

  # 4. PT/BT 下载直连保护
